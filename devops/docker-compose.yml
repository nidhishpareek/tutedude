services:
  flask_app:
    build: ./flask_mongo
    container_name: todo-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    environment:
      PORT: 5000
      DB_PATH: /data/app.db
    volumes:
      - sqlite_data:/data

  express_frontend:
    build: ./express_frontend
    container_name: todo-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8080}:3000"
    environment:
      PORT: 3000
      FLASK_SUBMIT_URL: http://flask_app:5000/submittodoitem
    depends_on:
      - flask_app

volumes:
  sqlite_data:
