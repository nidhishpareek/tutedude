# Runs both apps locally with SQLite: frontend http://localhost:8080, backend http://localhost:5000
#
# No container_name on purpose: fixed names collide with containers left over
# from other compose projects (e.g. the old flask_mongo one). Compose names them
# devops-flask_app-1 etc., and the apps still reach each other by service name.
services:
  flask_app:
    build: ./flask_mongo
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    environment:
      PORT: 5000
      DB_PATH: /data/app.db
    volumes:
      - sqlite_data:/data

  express_frontend:
    build: ./express_frontend
    restart: unless-stopped
    ports:
      # Host port 8080, not 3000: 3000 is the default for most JS dev servers (Next.js, React).
      - "${FRONTEND_PORT:-8080}:3000"
    environment:
      PORT: 3000
      FLASK_SUBMIT_URL: http://flask_app:5000/submittodoitem
    depends_on:
      - flask_app

volumes:
  sqlite_data:
